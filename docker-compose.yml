# Sweety - full stack in Docker: Postgres + PostgREST + Redis + API + web app.
# Usage: copy .env.example to .env, fill it in, then `docker compose up -d --build`.
name: sweety

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sweety
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # TCP check: the init-time server listens on the socket only, so this waits for init to finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sweety -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@postgres:5432/sweety
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: sweety_api
      PGRST_DB_MAX_ROWS: 1000 # same page cap as Supabase
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"] # cache only, no persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      POSTGREST_URL: http://postgrest:3000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      REPORTS_CACHE_TTL_SECONDS: ${REPORTS_CACHE_TTL_SECONDS:-3600}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8088}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgrest:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
